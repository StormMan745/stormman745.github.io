name: PetCare security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - run: npm ci --prefix tools --ignore-scripts
      - run: npm run --prefix tools check:build
      - run: node tools/build-memories.cjs --check
      - run: node tools/check-site-security.cjs
      - run: node tools/security-edge-check.cjs
      - run: node tools/check-assistant-records.cjs
      - run: node tools/check-care-edge.cjs
      - run: npm audit --prefix tools --audit-level=high
